<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Caderneta: venda, receba, controle o fiado e o estoque do seu negócio de um jeito simples."
    />
    <!-- Cores dos tokens: --color-primary (claro) e --surface-page (escuro). -->
    <meta name="theme-color" content="#007a51" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- "Adicionar à tela inicial": manifest (Android/Chrome) e metas do iPhone. Sem service
         worker, de propósito: o protótipo não guarda nada (o estado vive só em memória). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Caderneta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Caderneta" />
    <title>Caderneta</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Para usar a Caderneta, ative o JavaScript no seu navegador.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
